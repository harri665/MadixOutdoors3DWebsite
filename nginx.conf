# It's good practice to run worker processes as a non-privileged user
user nginx;
# Use `auto` to have Nginx detect the optimal number of worker processes
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip settings
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;
        # Note: 'model/gltf-binary' for .glb files is not included here
        # so they will not be gzipped by this module.

    server {
        listen 80;
        # CHANGE THIS: Replace with your actual domain name
        server_name your_domain.com;
        root /usr/share/nginx/html;
        index index.html index.htm;

        # -- KEY CHANGE: Security Headers Updated for iframe Embedding --
        # 1. Removed the old X-Frame-Options header.
        # 2. Removed deprecated X-XSS-Protection header.
        # 3. Updated Content-Security-Policy to allow embedding.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        # CHANGE THIS: Replace https://your-embedding-site.com with the domain that will contain the iframe.
        add_header Content-Security-Policy "frame-ancestors 'self' https://your-embedding-site.com; default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # -- KEY CHANGE: Corrected .glb file handling --
        # Removed `add_header Content-Encoding gzip;` which can corrupt files
        # if they are not already pre-gzipped on the server.
        location ~* \.glb$ {
            add_header Content-Type application/octet-stream;
            add_header Cache-Control "public, max-age=3600";
            expires 1h;
        }

        # Handle other static assets with long cache times
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Handle React routing for your Single Page App
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
    
    # --- RECOMMENDED: Add HTTPS with SSL ---
